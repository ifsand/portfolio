        t(key) {

        formatPeriod(start, end) {
            if (!end || end === '') return start + ' - ' + this.t('today');
            return start + ' - ' + end;
        },
        formatLocation(loc) {
            if (!loc) return '';
            const country = this.t('country_' + loc.countryCode) || loc.countryCode;
            return loc.city + ' (' + loc.region + '), ' + country;
        },
        openWindow(id) {
            this.windows[id].open = true;
            this.bringToFront(id);
        },
        closeWindow(id) {
            this.windows[id].open = false;
            if (this.activeWindow === id) this.activeWindow = null;
        },
        toggleWindow(id) {
            if (this.windows[id].open) {
                if (this.activeWindow === id) {
                    this.closeWindow(id);
                } else {
                    this.bringToFront(id);
                }
            } else {
                this.openWindow(id);
            }
        },
        bringToFront(id) {
            this.maxZ++;
            this.windows[id].zIndex = this.maxZ;
            this.activeWindow = id;
        },
        startDrag(e, id) {
            if (window.innerWidth <= 768) return;
            this.dragging = id;
            const win = document.getElementById(id);
            const rect = win.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            this.dragOffset = { x: clientX - rect.left, y: clientY - rect.top };
            this.bringToFront(id);
        },

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = Math.max(0, Math.min(clientX - this.dragOffset.x, window.innerWidth - win.offsetWidth));
            const y = Math.max(0, Math.min(clientY - this.dragOffset.y, window.innerHeight - win.offsetHeight - 60));
            win.style.left = x + 'px';
            win.style.top = y + 'px';
        },
        endDrag() { this.dragging = null; },
        showContextMenu(e) {
            e.preventDefault();
            this.contextMenu = {
                show: true,
                x: Math.min(e.clientX, window.innerWidth - 180),
                y: Math.min(e.clientY, window.innerHeight - 250)
            };
        },
        hideContextMenu() {
            this.contextMenu.show = false;
        },
        detectLang() {
            try {
                const stored = localStorage.getItem('cv-lang');
                if (stored === 'it' || stored === 'en') return stored;
            } catch (e) {}
            const nav = ((navigator.language || navigator.userLanguage) || '').toLowerCase();
            return nav.startsWith('it') ? 'it' : 'en';
        },
        setLang(lang) {
            if (lang !== 'it' && lang !== 'en') return;
            this.lang = lang;
            this.cv = this.cvSources[lang];
            try { localStorage.setItem('cv-lang', lang); } catch (e) {}
            document.documentElement.lang = lang;
            this.updateClock();
        },
        updateClock() {
            const now = new Date();
            const locale = this.lang === 'en' ? 'en-GB' : 'it-IT';
            this.clock = now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
            this.dateStr = now.toLocaleDateString(locale, { day: '2-digit', month: '2-digit', year: 'numeric' });
        },
        init() {
            this.cvSources = {
                it: JSON.parse(document.getElementById('cv-data-it').textContent),
                en: JSON.parse(document.getElementById('cv-data-en').textContent)
            };
            this.lang = this.detectLang();
            this.cv = this.cvSources[this.lang];
            document.documentElement.lang = this.lang;
            this.updateClock();
            setInterval(() => this.updateClock(), 1000);
        }
    }"

            <div class="icon-btn h-12 px-3 bg-motif-light motif-raised flex items-center gap-2 cursor-pointer text-sm font-bold"
                :class="menuOpen === 'main' ? 'motif-sunken' : ''"
                @click.stop="menuOpen = menuOpen === 'main' ? null : 'main'">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/>
                </svg>
                <span x-text="t('menu')"></span>
            </div>
            <div x-show="menuOpen === 'main'"
                x-transition:enter="transition ease-out duration-100"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                @click.outside="menuOpen = null"
                class="absolute bottom-full left-0 mb-0.5 bg-motif-light motif-raised min-w-[220px] shadow-lg">
                <div class="window-titlebar text-black text-xs font-bold px-2 py-1.5 border-b border-[#4a6aa0]" x-text="t('portfolioTitle')"></div>
                <div class="p-1">
                    <div class="px-2 py-1 text-xs text-motif-dark font-bold uppercase" x-text="t('sections')"></div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="openWindow('profilo'); menuOpen = null">
                        <span>👤</span> <span x-text="t('profilo')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="openWindow('esperienze'); menuOpen = null">
                        <span>💼</span> <span x-text="t('esperienze')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="openWindow('competenze'); menuOpen = null">
                        <span>🔧</span> <span x-text="t('competenze')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="openWindow('istruzione'); menuOpen = null">
                        <span>🎓</span> <span x-text="t('istruzione')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="openWindow('contatti'); menuOpen = null">
                        <span>📧</span> <span x-text="t('contatti')"></span>
                    </div>
                    <div class="my-1 border-t border-motif-dark"></div>
                    <div class="px-2 py-1 text-xs text-motif-dark font-bold uppercase" x-text="t('language')"></div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center justify-between gap-2"
                        @click="setLang('it'); menuOpen = null">
                        <span class="flex items-center gap-2">🇮🇹 <span x-text="t('italian')"></span></span>
                        <span x-show="lang === 'it'">✓</span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center justify-between gap-2"
                        @click="setLang('en'); menuOpen = null">
                        <span class="flex items-center gap-2">🇬🇧 <span x-text="t('english')"></span></span>
                        <span x-show="lang === 'en'">✓</span>
                    </div>
                    <div class="my-1 border-t border-motif-dark"></div>
                    <div class="px-2 py-1 text-xs text-motif-dark font-bold uppercase" x-text="t('actions')"></div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="Object.keys(windows).forEach(id => openWindow(id)); menuOpen = null">
                        <span>📂</span> <span x-text="t('openAll')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="Object.keys(windows).forEach(id => closeWindow(id)); menuOpen = null">
                        <span>✖️</span> <span x-text="t('closeAll')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="window.print(); menuOpen = null">
                        <span>🖨️</span> <span x-text="t('printCv')"></span>
                    </div>
                    <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center gap-2" @click="location.reload()">
                        <span>🔄</span> <span x-text="t('refresh')"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="hidden md:flex flex-1 min-w-0 items-center h-12 bg-motif-bg motif-sunken overflow-hidden"
            x-data="{
                scrollTray(dir) {
                    const tray = $refs.trayScroll;
                    tray.scrollBy({ left: dir * 100, behavior: 'smooth' });
                }
            }">
            <div class="icon-btn w-6 h-10 bg-motif-light motif-raised flex items-center justify-center cursor-pointer flex-shrink-0 hover:bg-motif-highlight"
                @click="scrollTray(-1)">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 8 8" fill="currentColor">
                    <path d="M5 1L2 4l3 3V1z"/>
                </svg>
            </div>
            <div x-ref="trayScroll" class="flex-1 w-0 flex items-center gap-1 px-1 h-10 overflow-x-auto scrollbar-hide">
                <template x-for="(win, id) in windows" :key="id">
                    <div x-show="win.open"
                        class="flex-shrink-0 h-8 px-3 flex items-center gap-2 cursor-pointer text-xs font-bold transition-all"
                        :class="activeWindow === id ? 'bg-motif-titlebar text-black motif-sunken' : 'bg-motif-light motif-raised hover:bg-motif-highlight'"
                        @click="toggleWindow(id)">
                        <span x-text="windowLabels[id]"></span>
                        <span x-text="t(id)" class="max-w-[80px] truncate"></span>
                    </div>
                </template>
                <div x-show="!Object.values(windows).some(w => w.open)" class="text-xs text-motif-dark italic px-2 whitespace-nowrap" x-text="t('noOpenWindows')"></div>
            </div>
            <div class="icon-btn w-6 h-10 bg-motif-light motif-raised flex items-center justify-center cursor-pointer flex-shrink-0 hover:bg-motif-highlight"
                @click="scrollTray(1)">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 8 8" fill="currentColor">
                    <path d="M3 1l3 3-3 3V1z"/>
                </svg>
            </div>
        </div>

        <div class="hidden md:flex items-center gap-1 p-1 h-12 bg-motif-bg motif-sunken">
            <div class="relative">
                <div class="icon-btn h-9 px-2 bg-motif-light motif-raised flex items-center justify-center cursor-pointer hover:bg-motif-highlight gap-1 text-xs font-bold"
                    :class="menuOpen === 'lang' ? 'motif-sunken' : ''"
                    :title="t('language')"
                    @click.stop="menuOpen = menuOpen === 'lang' ? null : 'lang'">
                    <span x-text="lang === 'it' ? '🇮🇹' : '🇬🇧'"></span>
                    <span x-text="lang.toUpperCase()"></span>
                </div>
                <div x-show="menuOpen === 'lang'"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    @click.outside="menuOpen = null"
                    class="absolute bottom-full right-0 mb-0.5 bg-motif-light motif-raised min-w-[160px] shadow-lg text-sm">
                    <div class="window-titlebar text-black text-xs font-bold px-2 py-1 border-b border-[#4a6aa0]" x-text="t('language')"></div>
                    <div class="p-1">
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer flex items-center justify-between"
                            @click="setLang('it'); menuOpen = null">
                            <span>🇮🇹 <span x-text="t('italian')"></span></span>
                            <span x-show="lang === 'it'">✓</span>
                        </div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer flex items-center justify-between"
                            @click="setLang('en'); menuOpen = null">
                            <span>🇬🇧 <span x-text="t('english')"></span></span>
                            <span x-show="lang === 'en'">✓</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="icon-btn w-10 h-9 bg-motif-light motif-raised flex items-center justify-center cursor-pointer hover:bg-motif-highlight"
                :title="t('printCv')"
                @click="window.print()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
                </svg>
            </div>
            <div class="relative">
                <div class="icon-btn w-10 h-9 bg-motif-light motif-raised flex items-center justify-center cursor-pointer"
                    :class="menuOpen === 'guida' ? 'motif-sunken' : ''"
                    :title="t('guideTitle')"
                    @click.stop="menuOpen = menuOpen === 'guida' ? null : 'guida'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                </div>
                <div x-show="menuOpen === 'guida'"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    @click.outside="menuOpen = null"
                    class="absolute bottom-full right-0 mb-0.5 bg-motif-light motif-raised w-[300px] shadow-lg text-sm">
                    <div class="window-titlebar text-black text-xs font-bold px-2 py-1 border-b border-[#4a6aa0]" x-text="t('guideTitle')"></div>
                    <div class="p-3 bg-motif-light max-h-[60vh] overflow-y-auto">
                        <p class="mb-2 text-xs" x-text="t('guideIntro')"></p>
                        <div class="bg-white motif-sunken p-2 mb-2">
                            <ul class="ml-4 list-disc space-y-0.5 text-xs">
                                <li><strong x-text="t('guideIcons')"></strong> <span x-text="t('guideIconsDesc')"></span></li>
                                <li><strong x-text="t('guideWindows')"></strong> <span x-text="t('guideWindowsDesc')"></span></li>
                                <li><strong x-text="t('guideMenu')"></strong> <span x-text="t('guideMenuDesc')"></span></li>
                                <li><strong x-text="t('guideTaskbar')"></strong> <span x-text="t('guideTaskbarDesc')"></span></li>
                            </ul>
                        </div>
                        <p class="text-xs text-motif-dark">🖨️ <strong x-text="t('guidePrintHint')"></strong> <span x-text="t('guidePrintTail')"></span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="hidden md:flex items-center p-1 h-12 bg-motif-bg motif-sunken">
            <div class="h-9 px-2 bg-motif-light motif-raised flex flex-col items-center justify-center text-[10px] font-bold font-mono leading-tight">
                <span x-text="dateStr"></span>
                <span x-text="clock"></span>
            </div>
        </div>

        <div class="flex md:hidden flex-1 items-center gap-1 h-16">
            <div class="relative">
                <div class="icon-btn w-12 h-12 bg-motif-light motif-raised flex items-center justify-center cursor-pointer"
                    :class="menuOpen === 'main' ? 'motif-sunken' : ''"
                    @click.stop="menuOpen = menuOpen === 'main' ? null : 'main'">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 5h18v2H3V5zm0 6h18v2H3v-2zm0 6h18v2H3v-2z"/>
                    </svg>
                </div>
                <div x-show="menuOpen === 'main'"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="opacity-0"
                    x-transition:enter-end="opacity-100"
                    @click.outside="menuOpen = null"
                    class="absolute bottom-full left-0 mb-0.5 bg-motif-light motif-raised min-w-[200px] shadow-lg">
                    <div class="window-titlebar text-black text-xs font-bold px-2 py-1 border-b border-[#4a6aa0]" x-text="t('menu')"></div>
                    <div class="p-1">
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm" @click="openWindow('profilo'); menuOpen = null">👤 <span x-text="t('profilo')"></span></div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm" @click="openWindow('esperienze'); menuOpen = null">💼 <span x-text="t('esperienze')"></span></div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm" @click="openWindow('competenze'); menuOpen = null">🔧 <span x-text="t('competenze')"></span></div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm" @click="openWindow('istruzione'); menuOpen = null">🎓 <span x-text="t('istruzione')"></span></div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm" @click="openWindow('contatti'); menuOpen = null">📧 <span x-text="t('contatti')"></span></div>
                        <div class="my-1 border-t border-motif-dark"></div>
                        <div class="px-2 py-1 text-xs text-motif-dark font-bold uppercase" x-text="t('language')"></div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center justify-between"
                            @click="setLang('it'); menuOpen = null">
                            <span>🇮🇹 <span x-text="t('italian')"></span></span>
                            <span x-show="lang === 'it'">✓</span>
                        </div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm flex items-center justify-between"
                            @click="setLang('en'); menuOpen = null">
                            <span>🇬🇧 <span x-text="t('english')"></span></span>
                            <span x-show="lang === 'en'">✓</span>
                        </div>
                        <div class="my-1 border-t border-motif-dark"></div>
                        <div class="px-3 py-1.5 hover:bg-motif-titlebar cursor-pointer text-sm" @click="window.print(); menuOpen = null">🖨️ <span x-text="t('print')"></span></div>
                    </div>
                </div>
            </div>

            <div class="flex-1 min-w-0 flex items-center h-12 bg-motif-bg motif-sunken overflow-hidden"
                x-data="{
                    scrollTrayMobile(dir) {
                        const tray = $refs.trayScrollMobile;
                        tray.scrollBy({ left: dir * 50, behavior: 'smooth' });
                    }
                }">
                <div class="icon-btn w-6 h-10 bg-motif-light motif-raised flex items-center justify-center cursor-pointer flex-shrink-0"
                    @click="scrollTrayMobile(-1)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 8 8" fill="currentColor">
                        <path d="M5 1L2 4l3 3V1z"/>
                    </svg>
                </div>
                <div x-ref="trayScrollMobile" class="flex-1 w-0 flex items-center gap-1 px-1 h-10 overflow-x-auto scrollbar-hide">
                    <template x-for="(win, id) in windows" :key="id">
                        <div x-show="win.open"
                            class="flex-shrink-0 w-9 h-8 flex items-center justify-center cursor-pointer text-base"
                            :class="activeWindow === id ? 'bg-motif-titlebar motif-sunken' : 'bg-motif-light motif-raised'"
                            @click="toggleWindow(id)"
                            :title="t(id)">
                            <span x-text="windowLabels[id]"></span>
                        </div>
                    </template>
                </div>
                <div class="icon-btn w-6 h-10 bg-motif-light motif-raised flex items-center justify-center cursor-pointer flex-shrink-0"
                    @click="scrollTrayMobile(1)">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 8 8" fill="currentColor">
                        <path d="M3 1l3 3-3 3V1z"/>
                    </svg>
                </div>
            </div>

            <div class="flex items-center gap-1 h-12">
                <div class="relative">
                    <div class="icon-btn w-10 h-10 bg-motif-light motif-raised flex items-center justify-center cursor-pointer"
                        :class="menuOpen === 'guida' ? 'motif-sunken' : ''"
                        @click.stop="menuOpen = menuOpen === 'guida' ? null : 'guida'">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                        </svg>
                    </div>
                    <div x-show="menuOpen === 'guida'"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0"
                        x-transition:enter-end="opacity-100"
                        @click.outside="menuOpen = null"
                        class="absolute bottom-full right-0 mb-0.5 bg-motif-light motif-raised w-[250px] shadow-lg text-xs">
                        <div class="window-titlebar text-black text-xs font-bold px-2 py-1 border-b border-[#4a6aa0]" x-text="t('guideTitle')"></div>
                        <div class="p-2 bg-motif-light">
                            <ul class="ml-3 list-disc space-y-0.5">
                                <li><strong x-text="t('guideIcons')"></strong> <span x-text="t('guideIconsDesc')"></span></li>
                                <li><strong x-text="t('guideMobileBar')"></strong> <span x-text="t('guideMobileBarDesc')"></span></li>
                                <li><strong x-text="t('guideMobileMenu')"></strong> <span x-text="t('guideMobileMenuDesc')"></span></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="px-2 h-10 bg-motif-light motif-raised flex flex-col items-center justify-center text-[10px] font-bold font-mono leading-tight">
                    <span x-text="dateStr"></span>
                    <span x-text="clock"></span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
